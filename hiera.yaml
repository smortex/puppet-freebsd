---
version: 5

defaults:
  datadir: data
  data_hash: yaml_data

hierarchy:
  - name: "Full version"
    path: "%{facts.os.name}-%{facts.os.release.major}.%{facts.os.release.minor}.yaml"
  - name: "Major version"
    path: "%{facts.os.name}-%{facts.os.release.major}.yaml"
  - name: 'Distribution name'
    path: '%{facts.os.name}.yaml'
  - name: 'OS family'
    path: '%{facts.os.family}.yaml'
  - name: 'common'
    path: 'common.yaml'
